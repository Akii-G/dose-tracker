name: Dose
options:
  bundleIdPrefix: io.github.akiig
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "5"
targets:
  Dose:
    type: application
    platform: iOS
    sources:
      - path: Dose
      - path: ../data/medicines-it.tsv
        buildPhase: resources
      - path: ../data/sounds          # chime.wav, bell.wav, soft.wav at the top of the app, where iOS looks
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.akiig.dose
        PRODUCT_NAME: Dose
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: NO
    info:
      path: Dose/Info.plist
      properties:
        CFBundleDisplayName: Dose
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, it]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocalNetworkUsageDescription: Dose syncs your medicines with Dose on your PC over your home Wi-Fi.
        NSCameraUsageDescription: Dose reads the barcode on a medicine's box to fill in its name. Nothing is recorded or sent.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
schemes:
  Dose:
    build:
      targets:
        Dose: all
